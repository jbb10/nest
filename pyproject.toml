[project]
name = "nest"
version = "2.1.0"
description = "AI-powered document context tool for projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=15.0.0",
    "pydantic>=2.14.1",
    "jinja2>=3.1.0",
    "docling>=2.140.0",
    "pyyaml>=6.0",
    "openai>=3.35.1",
]

[project.urls]
Homepage = "https://github.com/jbb10/nest"
Repository = "https://github.com/jbb10/nest"
Changelog = "https://github.com/jbb10/nest/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/jbb10/nest/issues"

[project.scripts]
nest = "nest.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "e2e: End-to-end tests (require real Docling, may be slow)",
]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Ruff only lints and formats Python files. Since ruff 0.16 the formatter
# also reformats Python code blocks inside Markdown files by default;
# those blocks are documentation, out of the formatter's scope here.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["nest"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "pyright>=1.1.414",
    "reportlab>=5.0.1",
    "pytest-timeout>=2.4.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
]
