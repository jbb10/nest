[project]
name = "nest"
# The version lives in src/nest/__init__.py (single source of truth, bumped
# by release-please) and is read at build time, so uv.lock records no version
# for nest and a release bump cannot leave the lock stale.
dynamic = ["version"]
description = "AI-powered document context tool for projects"
readme = "README.md"
requires-python = ">=3.11"
# Compatible-release ranges (~=X.Y.Z): a fresh `uv tool install` resolves the
# newest PATCH release only. Minor and major upstream releases reach users
# solely through a reviewed PR that raises a range (issue #52).
dependencies = [
    "typer~=0.26.8",
    "rich~=15.0.0",
    "pydantic~=2.14.1",
    "jinja2~=3.1.6",
    "docling~=2.140.0",
    "pyyaml~=6.0.3",
    "openai~=3.35.1",
    "pypdfium2~=4.30.0",
    "pillow~=11.3.0",
]

[project.urls]
Homepage = "https://github.com/jbb10/nest"
Repository = "https://github.com/jbb10/nest"
Changelog = "https://github.com/jbb10/nest/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/jbb10/nest/issues"

[project.scripts]
nest = "nest.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nest"]

[tool.hatch.version]
path = "src/nest/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "e2e: End-to-end tests (require real Docling, may be slow)",
]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Ruff only lints and formats Python files. Since ruff 0.16 the formatter
# also reformats Python code blocks inside Markdown files by default;
# those blocks are documentation, out of the formatter's scope here.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["nest"]

[tool.deptry.per_rule_ignores]
# Nest deliberately reaches into Docling's own stack: the document model
# types it writes (docling_core), model downloads (huggingface_hub), and
# transformers' logging. Their versions are governed by the docling~= range.
# Any other transitive import — a reintroduced standalone click, issue #51 —
# fails the build, as does any import of a package nothing declares.
DEP003 = ["docling_core", "huggingface_hub", "transformers"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "pyright>=1.1.414",
    "reportlab>=5.0.1",
    "pytest-timeout>=2.4.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "deptry>=0.23.0",
]
