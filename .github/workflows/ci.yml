name: CI

# Continuous integration gate.
# Runs on every pull request targeting main and on direct pushes to main.
# main is protected: this workflow must pass before a PR can be merged.
# workflow_dispatch lets maintainers re-run the suite on demand, e.g. to
# gather consecutive first-attempt Windows passes for flakiness checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail fast and keep uv output deterministic in CI: assert that uv.lock
  # matches pyproject.toml instead of silently using a stale lock. Jobs that
  # deliberately re-resolve (quality, install-smoke) override this to "0".
  UV_LOCKED: "1"

jobs:
  # ── Static quality gate: lint, formatting, and strict type checking ──────────
  # Uses CPU-only PyTorch to avoid downloading ~1.8 GB of nvidia-CUDA wheels.
  # The quality job never runs torch inference, so CUDA is unnecessary.
  #
  # UV_INDEX (CPU PyTorch) takes priority over UV_DEFAULT_INDEX (PyPI), and
  # UV_INDEX_STRATEGY=unsafe-best-match lets uv pick the best version across
  # both indexes. --upgrade-package torch/torchvision/triton forces uv to
  # re-resolve those packages (ignoring lockfile pins to the CUDA wheel), so
  # UV_LOCKED is disabled here; the lockfile still seeds every other package,
  # keeping the resolution fast and deterministic.
  quality:
    name: Lint · Format · Types
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "0"
      UV_INDEX: https://download.pytorch.org/whl/cpu
      UV_DEFAULT_INDEX: https://pypi.org/simple
      UV_INDEX_STRATEGY: unsafe-best-match
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        # Pinned to the full version: setup-uv stopped publishing major/minor
        # tags after v8 (immutable releases only).
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ runner.os }}-lint

      - name: Install project + dev dependencies (CPU-only torch)
        run: uv sync --dev --upgrade-package torch --upgrade-package torchvision --upgrade-package triton

      - name: Lint (ruff)
        run: make lint

      - name: Format check (ruff)
        run: make format-check

      - name: Type check (pyright strict)
        run: make typecheck

      - name: Check dependency ranges
        run: make check-deps

      - name: Check declared dependencies (deptry)
        run: make deptry

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan (gitleaks)
        run: make scan-secrets

  # ── Unit / integration tests ─────────────────────────────────────────────────
  # Single, fast run. CI tests one representative Python version (uv selects a
  # compatible interpreter from the project's python requirement). The full e2e
  # suite runs in the dedicated `e2e` job below.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ runner.os }}
          prune-cache: true

      - name: Install project + dev dependencies
        run: uv sync --dev

      - name: Run unit & integration tests
        run: make test

  # ── End-to-end tests ─────────────────────────────────────────────────────────
  # Full e2e suite against real Docling. Requires ~2.5 GB of ML models, which we
  # cache between runs. Runs on all supported platforms (public repo = free).
  # windows needs UTF-8 mode for Rich.
  # LLM-gated e2e tests use the shared test proxy configured in tests/e2e/conftest.py.
  e2e:
    name: E2E tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ runner.os }}
          prune-cache: true

      - name: Install project + dev dependencies
        run: uv sync --dev

      # Cache key format: docling-models-v3-${{ runner.os }}
      # v3 = third generation: added the HuggingFace hub cache that docling
      # >= 2.118's inference engines load the layout, picture-classifier and
      # TableFormer models from (v2 = per-OS docling cache only). Bump the
      # version number whenever the model set or cache layout changes to
      # avoid serving stale entries.
      # No restore-keys — a cache miss must re-download rather than potentially
      # serving models built for a different Python version or OS.
      - name: Restore Docling ML models
        id: docling-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/docling
            ~\AppData\Local\docling\cache
            ~/.cache/huggingface/hub
          key: docling-models-v3-${{ runner.os }}

      - name: Prepare Docling ML models
        if: steps.docling-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          uv run python -c "from nest.adapters.docling_downloader import
          DoclingModelDownloader as D; D().download_if_needed(progress=False)"

      - name: Save Docling ML models
        if: steps.docling-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/docling
            ~\AppData\Local\docling\cache
            ~/.cache/huggingface/hub
          key: ${{ steps.docling-cache.outputs.cache-primary-key }}

      - name: Run end-to-end tests
        shell: bash
        run: make test-e2e E2E_TIMEOUT=180
        env:
          NEST_LLM_API_KEY: ${{ secrets.NEST_AI_API_KEY }}

  # ── Install smoke: test what users actually install ─────────────────────────
  # `uv tool install` ignores uv.lock and resolves the newest versions the
  # pyproject.toml ranges permit - exactly what a user gets (issue #52). This
  # job installs the tool from the checkout into an isolated UV_TOOL_DIR /
  # UV_TOOL_BIN_DIR and exercises the executable from an empty directory with
  # no NEST_* configuration, so a broken fresh install (like the typer 0.26
  # crash in #51) fails CI instead of reaching users. UV_LOCKED is disabled:
  # the whole point is a fresh resolution. scripts/install_smoke.py fails the
  # job on any unexpected exit code or Python traceback.
  install-smoke:
    name: Install smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_LOCKED: "0"
      # windows needs UTF-8 mode for Rich output through pipes.
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `runner.temp` is only available in step contexts, so the isolated tool
      # directories are exported here instead of in the job-level env block.
      - name: Isolate the uv tool directories
        shell: bash
        run: |
          echo "UV_TOOL_DIR=${RUNNER_TEMP}/nest-smoke-tool" >> "$GITHUB_ENV"
          echo "UV_TOOL_BIN_DIR=${RUNNER_TEMP}/nest-smoke-tool-bin" >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # The fresh resolution ignores uv.lock, so key the cache on the
          # ranges that drive it.
          cache-dependency-glob: "pyproject.toml"
          cache-suffix: ${{ runner.os }}-install-smoke
          prune-cache: true

      - name: Install nest the way a user does
        run: uv tool install .

      - name: Smoke-test the installed tool
        run: uv run --no-project python scripts/install_smoke.py

  # ── Aggregate status check ───────────────────────────────────────────────────
  # Single required check to configure in branch protection, independent of the
  # matrix dimensions above.
  ci-success:
    name: CI success
    if: always()
    needs: [quality, test, e2e, install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        shell: bash
        run: |
          # Collect results from all upstream jobs
          for job_result in \
            "${{ needs.quality.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.install-smoke.result }}"; do
            if [[ "$job_result" != "success" ]]; then
              echo "One or more CI jobs failed."
              exit 1
            fi
          done
          echo "All CI jobs passed."
