name: CI

# Continuous integration gate.
# Runs on every pull request targeting main and on direct pushes to main.
# main is protected: this workflow must pass before a PR can be merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail fast and keep uv output deterministic in CI.
  UV_FROZEN: "1"

jobs:
  # ── Static quality gate: lint, formatting, and strict type checking ──────────
  quality:
    name: Lint · Format · Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project + dev dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: make lint

      - name: Format check (ruff)
        run: make format-check

      - name: Type check (pyright strict)
        run: make typecheck

  # ── Unit / integration tests ─────────────────────────────────────────────────
  # Single, fast run. CI tests one representative Python version (uv selects a
  # compatible interpreter from the project's python requirement). The full e2e
  # suite runs in the dedicated `e2e` job below.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project + dev dependencies
        run: uv sync --dev

      - name: Run unit & integration tests
        run: make test

  # ── End-to-end tests ─────────────────────────────────────────────────────────
  # Full e2e suite against real Docling. Requires ~2.5 GB of ML models, which we
  # cache between runs. Run on a single Python version to keep runtime bounded.
  # AI-gated e2e tests use the shared test proxy configured in tests/e2e/conftest.py.
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project + dev dependencies
        run: uv sync --dev

      - name: Cache Docling ML models
        uses: actions/cache@v4
        with:
          path: ~/.cache/docling
          key: docling-models-v1

      - name: Download Docling models (if not cached)
        run: >-
          uv run python -c "from nest.adapters.docling_downloader import
          DoclingModelDownloader as D; D().download_if_needed(progress=False)"

      - name: Run end-to-end tests
        run: make test-e2e

  # ── Aggregate status check ───────────────────────────────────────────────────
  # Single required check to configure in branch protection, independent of the
  # matrix dimensions above.
  ci-success:
    name: CI success
    if: always()
    needs: [quality, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
