name: PR Validation

# Guards that keep pull requests compatible with the automated release pipeline.
#
# Because releases are cut by release-please from the Conventional Commit history
# on main, and PRs are squash-merged (the PR title becomes the commit subject),
# a well-formed PR title is what keeps semantic versioning and changelog
# generation automatic. Branch-name validation is a lighter convention check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Conventional Commit PR title (required) ──────────────────────────────────
  title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types - single source of truth: CONTRIBUTING.md.
          # Must match the branch-name regex and release-please-config.json
          # changelog-sections below.
          types: |
            feat
            fix
            docs
            perf
            refactor
            test
            chore
            ci
            build
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject must start with a lowercase letter, e.g.
            "feat(sync): add parallel processing".

  # ── Dependency review (advisory security gate) ───────────────────────────────
  # Fails when a PR introduces a dependency with a known GitHub advisory.
  # Compares the dependency snapshots of the base and head refs through the
  # repository dependency graph (uv.lock), so nothing is installed. Advisory
  # only: branch protection still requires just `CI success` and
  # `Validate PR title`, so this check cannot block a merge on its own.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # fail-on-severity stays at its default (low): any known advisory in a
      # newly added dependency fails the check.
      - name: Review dependencies for known advisories
        uses: actions/dependency-review-action@v5

  # ── Branch naming convention (advisory) ──────────────────────────────────────
  # Optional convention check. Automated branches (release-please, dependabot)
  # are exempt.
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" == release-please--* || "$BRANCH" == dependabot/* ]]; then
            echo "Automated branch '$BRANCH' - skipping convention check."
            exit 0
          fi
          if [[ "$BRANCH" =~ ^(feat|fix|docs|refactor|test|chore|ci|build|perf)/[a-z0-9._-]+$ ]]; then
            echo "Branch name '$BRANCH' follows the convention."
            exit 0
          fi
          echo "::error::Branch '$BRANCH' does not follow the naming convention."
          echo "Expected: <type>/<short-description>, e.g. feat/sync-parallelism"
          echo "Allowed types: feat, fix, docs, refactor, test, chore, ci, build, perf - see CONTRIBUTING.md"
          exit 1
