name: PR Title

# Enforces Conventional Commits on the pull request title. Squash-merges use the
# PR title as the commit subject, and the release tooling (git-cliff +
# scripts/release.sh) derives the semantic version bump from those subjects, so a
# well-formed title is what keeps the release pipeline automatic.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types mirror cliff.toml commit_parsers.
          types: |
            feat
            fix
            docs
            perf
            refactor
            test
            chore
            ci
            build
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject must start with a lowercase letter, e.g.
            "feat(sync): add parallel processing".
