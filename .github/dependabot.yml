version: 2
updates:
  # Python dependencies managed by uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-dev:
        dependency-type: "development"
      # Runtime bumps travel as one weekly PR (issue #52): raising a direct
      # dependency range is a reviewed change, and a grouped PR keeps the
      # review load inside the open-PR limit.
      python-prod:
        dependency-type: "production"

  # Keep GitHub Actions pinned versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
